[pytest]
# Pytest configuration for PositioningAI backend tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (isolated functions, no external dependencies)
    integration: Integration tests (with API, database, external services)
    security: Security-related tests
    e2e: End-to-end tests (critical user flows)

# Coverage
addopts = --strict-markers

# Logging
log_cli = false
log_level = WARNING
